name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  macos-app:
    # macos-14 runners are Apple Silicon (arm64)
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHON=python scripts/build_macos.sh
      - name: Smoke-test the bundled app
        run: |
          file dist/mANY-MAZE.app/Contents/MacOS/mANY-MAZE
          QT_QPA_PLATFORM=offscreen MANYMAZE_SMOKE_TEST=1 dist/mANY-MAZE.app/Contents/MacOS/mANY-MAZE
      - uses: actions/upload-artifact@v4
        with:
          name: mANY-MAZE-macos-arm64
          path: dist/*.dmg
