name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  POSE_URL: https://huggingface.co/mwmathis/DeepLabCutModelZoo-SuperAnimal-TopViewMouse/resolve/main/superanimal_topviewmouse_rtmpose_s.pt
  # DeepLabCut's example open-field video (LGPL-3.0), used only for benchmarking
  BENCH_VIDEO_URL: https://github.com/DeepLabCut/DeepLabCut/raw/main/examples/openfield-Pranav-2018-10-30/videos/m3v1mp4.mp4

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  macos-app:
    # macos-14 runners are Apple Silicon (arm64)
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHON=python scripts/build_macos.sh
      - name: Download the pose model for testing
        run: curl -sSfL -o "$RUNNER_TEMP/rtmpose_s.pt" "$POSE_URL"
      - name: Smoke-test the bundled app (parallel workers, decoding, recording, Core ML pose model)
        run: |
          file dist/mANY-MAZE.app/Contents/MacOS/mANY-MAZE
          QT_QPA_PLATFORM=offscreen MANYMAZE_SMOKE_TEST=1 MANYMAZE_SMOKE_POSE="$RUNNER_TEMP/rtmpose_s.pt" \
            dist/mANY-MAZE.app/Contents/MacOS/mANY-MAZE
      - uses: actions/upload-artifact@v4
        with:
          name: mANY-MAZE-macos-arm64
          path: dist/*.dmg

  benchmark:
    # Apple Silicon: VideoToolbox decoding/encoding, Core ML pose inference, parallel batch tracking
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download test video and pose model
        run: |
          curl -sSfL -o "$RUNNER_TEMP/m3v1mp4.mp4" "$BENCH_VIDEO_URL"
          curl -sSfL -o "$RUNNER_TEMP/rtmpose_s.pt" "$POSE_URL"
      - name: Benchmark
        run: |
          python scripts/benchmark.py --video "$RUNNER_TEMP/m3v1mp4.mp4" --checkpoint "$RUNNER_TEMP/rtmpose_s.pt" \
            --workdir "$RUNNER_TEMP/bench" | tee benchmark.md
          sed -n '/^# /p;/^| /p' benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-macos-arm64
          path: benchmark.md
