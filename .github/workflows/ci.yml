name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  POSE_URL: https://huggingface.co/mwmathis/DeepLabCutModelZoo-SuperAnimal-TopViewMouse/resolve/main/superanimal_topviewmouse_rtmpose_s.pt
  # DeepLabCut's example open-field video (LGPL-3.0), used only for benchmarking
  BENCH_VIDEO_URL: https://github.com/DeepLabCut/DeepLabCut/raw/main/examples/openfield-Pranav-2018-10-30/videos/m3v1mp4.mp4

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.11.13 check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows:
    # mANY-MAZE ships for macOS only; this job measures how far the code is from running on Windows (TODO §18)
    runs-on: windows-latest
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  macos-app:
    # macos-14 runners are Apple Silicon (arm64)
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Developer ID signing and notarisation when the repository has these secrets (README: "Signed and
      # notarised macOS builds"); without them (forks, pull requests) the app is ad-hoc signed as before.
      - name: Build, sign and notarise the app and disk image
        run: PYTHON=python scripts/build_macos.sh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Show the signature
        run: |
          codesign -dv --verbose=2 dist/mANY-MAZE.app 2>&1 | grep -E '^(Authority|TeamIdentifier|Signature|Runtime)' || true
          xcrun stapler validate dist/mANY-MAZE.app || echo "not notarised (no Developer ID secrets)"
      - name: Download the pose model for testing
        run: curl -sSfL -o "$RUNNER_TEMP/rtmpose_s.pt" "$POSE_URL"
      - name: Smoke-test the bundled app (parallel workers, decoding, recording, Core ML pose model)
        run: |
          file dist/mANY-MAZE.app/Contents/MacOS/mANY-MAZE
          QT_QPA_PLATFORM=offscreen MANYMAZE_SMOKE_TEST=1 MANYMAZE_SMOKE_POSE="$RUNNER_TEMP/rtmpose_s.pt" \
            dist/mANY-MAZE.app/Contents/MacOS/mANY-MAZE
      - uses: actions/upload-artifact@v4
        with:
          name: mANY-MAZE-macos-arm64
          path: dist/*.dmg

  benchmark:
    # Apple Silicon: VideoToolbox decoding/encoding, Core ML pose inference, parallel batch tracking
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download test video and pose model
        run: |
          curl -sSfL -o "$RUNNER_TEMP/m3v1mp4.mp4" "$BENCH_VIDEO_URL"
          curl -sSfL -o "$RUNNER_TEMP/rtmpose_s.pt" "$POSE_URL"
      - name: Benchmark
        run: |
          python scripts/benchmark.py --video "$RUNNER_TEMP/m3v1mp4.mp4" --checkpoint "$RUNNER_TEMP/rtmpose_s.pt" \
            --workdir "$RUNNER_TEMP/bench" | tee benchmark.md
          sed -n '/^# /p;/^| /p' benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-macos-arm64
          path: benchmark.md
